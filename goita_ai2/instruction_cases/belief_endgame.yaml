schema_version: 1
category: endgame
cases:
  - id: BELIEF-001
    status: confirmed
    scope: 強化中AI2
    title: 行動上の主張を確定枚数と混同せず複数の手駒配分で終盤を比較する
    source_report: goita_ai_review_20261025005449_round4_D_turn24.json
    conditions:
      - 全員の手駒が4枚以下で、敵方に残り2枚のプレイヤーがいる
      - 公開情報から複数の手駒配分が成立する
    required:
      - 終盤比較では初手の馬・銀・金・香の枚数主張は確率の材料にし、通常戦術用の枚数範囲で配分を除外しない
      - 相方への初手の返しは単発のかかりごたえでも成立する
      - 攻めを選べる初回の機会に相方の中駒を返さなかった履歴を保有確率へ反映する
      - 3つ目に王か玉を出さなくても、そのプレイヤーの保有可能性を残す
      - 受けと次の攻めを固定した組み合わせを複数の配分で比較する
      - 攻めの手番で計画を再検討し、直後の敵方の即上がりも減点する
      - 標本内の上がり率・危険率と不確実性を説明ログに残す
      - 公開情報から証明された受けを、標本上の高得点を理由に置き換えない
      - 行動履歴への追加の重み付けは対象の終盤で適用し、序盤の既存戦術を維持する
    forbidden:
      - 他人の実際の手駒や伏せ駒の種類を参照して候補を作る
      - 推定した一つの配分の勝ち筋を確定上がりとして保護する
      - 標本ごとに異なる後続攻めを選び、その最善値を受けの評価に合算する
      - 探索上限に達した一部の配分だけで強い終盤計画を確定する
      - 保存版の中級者（中3）へ変更を適用する
    regression:
      tests:
        - tests/test_belief_endgame.py
