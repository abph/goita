schema_version: 1
category: shi_strategy
cases:
  - id: SHI-SUPPORT-001
    status: confirmed
    scope: 強化中AI2
    title: し攻めへの協力が難しいときは受けと別攻めを一つの意思表示として比較する
    source_report: goita_ai_review_20261111055909_round1_D_turn4.json
    thinking_style: safe
    conditions:
      - 相方のしを敵方が受け、し・香以外の通常駒で攻めた直後
      - 自分にはしが0枚か1枚しかなく、し攻めの賛同をまだ伝えていない
      - 同種駒で受けられ、相方を含む他家はまだリーチしていない
      - 受けた後に有力な別攻めと、残り手駒からの後続手順がある
      - 通常判断が未確定のパスであり、優先すべき確定上がり等がない
    required:
      - 受ける時点で次に出す駒と後続の攻めを確認する
      - 受けた後の攻めはその計画を引き継ぎ、上位の確定判断を優先する
      - 自分の1しを、相方のし攻めに十分協力できる状態と同一視しない
      - 相方側は実際の受けと別攻めを見て初めて協力の薄さを記録する
      - 相方はし攻めの継続加点を見直すが、敵方のしが尽きた確定的な筋は残す
    forbidden:
      - 1しなら無条件に敵の攻めを受ける
      - 意味のない単発中駒だけで受け後の攻めが成立したとみなす
      - 他家の実際の非公開手駒を参照する
      - 合図をし0枚という厳密な枚数制約に変換する
      - 検討だけで合図を伝達済みにする
      - 保存版の中級者へ適用する
    regression:
      tests:
        - tests/test_shi_support_change.py
        - tests/shi_support_change_log.cjs
