schema_version: 1
category: late_receive_continuation
cases:
- id: LATE-RECEIVE-001
  status: confirmed
  profile: experimental_ai2
  title: 敵の2枚目以降を固定の受け優先点ではなく上がり筋で比較する
  priority: high
  conditions:
  - 敵の2枚目以降のし以外の攻めを受けるかパスするか判断する
  required:
  - AI2だけで、通常受け+10000、王か玉で受け+1000、パス-10000の固定補正を取り消す。
  - し攻め・敵の初手への対応、確定上がり、既存の優先戦術は維持する。
  - 自分が王か玉を含む残り4枚で、敵の即上がりが目前ではない場合、同じ重み付き 想定配牌の中でパスと各受け・直後の各攻めを比較する。途中の受け返しも探索に含む。
  - 相手の手駒・伏せ・次の攻め・残り2枚は想定であり、実際の非公開手駒を参照しない。
  - 通常の駒で受け、公開情報で他の王か玉が残っていない王か玉を攻めに使い、 最後の伏せと攻めで上がれる分岐は、探索途中でもその上がり点まで評価する。
  - 標本全体の比較は確定上がりと呼ばない。受け手なしで1巡する標本の重みは 標本内の下限であり、1巡する確率全体と混同しない。
  - 他家の行動はその人の手駒と公開履歴から上位2候補を重み付けして予測し、こちらの非公開手駒に合わせた最善応手を与えない。
  - 1巡の行動モデル推定と、他家が受けられないため1巡が確実な標本の重みを区別し、いずれも実測された確率とは呼ばない。
  - 探索末端でも、受けと直後の攻めで上がれる手を確認し、敵の即上がりを途中評価に埋もれさせない。
  - 比較差が標本のばらつきの範囲内で、最後の王か玉を使っても通常駒3種類がばらばらに残る場合は、 次の全種類に受けが残り、複数の通常受けから王か玉で攻める筋があることを確認して温存を優先する。 ばらつきの幅は実際の勝率の信頼区間ではなく、推定値を断定しないための判断材料とする。
  - 48候補・深さ10・追加最大2秒、全体の20秒上限内。比較が未完了、既存戦術が優先の場合は上書きしない。
  - 採用した受けと攻めは一組で扱い、公開局面が変わったら破棄する。
  - 比較で上書きした場合、採用しなかった元の探索手を汎用戦術辞書へ記録しない。
  - 追加の受け・パス比較は実際の手番でのみ行い、バックグラウンド先読みでは起動しない。
  reason: 敵の2枚目以降のし以外の攻めを、固定の受け優先点ではなく、受けた後の攻めと パス後の相手の次の攻め・残り手駒を含めて比較する。
  regression:
    state: covered
    source_report: goita_ai_review_20261119014634_round1_A_turn13.json
