schema_version: 1
category: opening_shared_middle_pair
cases:
- id: OPENING-PAIR-RECEIVE-001
  status: confirmed
  profile: experimental_ai2
  title: 敵の初手の中駒と自分の2枚持ちを合わせて受けを比較する
  conditions:
  - 自分がまだ動いていない8枚の手駒で、敵の1枚目の攻めを直後に受ける立場
  - 攻めは香・馬・銀・金で、自分の初期手駒にも現在の手駒にも同じ駒が2枚
  - 公開された同種はその初手1枚だけで、初手の複数持ちの合図が崩れていない
  - 初期手駒の戦略ランクがC以下で、同種受けの後にも攻め手がある
  required:
  - 初手の合図と4枚の全体在庫から敵2枚・自分2枚を推定する。実際の非公開手駒は使わず、確定情報とは扱わない。
  - この構造では、初期手駒ランクだけによる受け・パス補正を外す。同じ駒を1枚残して今受け、相方へ方針を伝える筋を通常の受け評価と探索で比較する。
  - 王か玉の消費、相手の残り枚数、既存の上がり筋、し攻め、香の攻め1〜3の検討は維持する。
  - 相方のし攻めの応答待ち・し攻めモード・引き継ぎが進行中なら、その既存戦術を優先して今回の補正変更を適用しない。
  - 香は次の受け手のみを対象とし、後続の受け手のパス寄り方針は維持する。
  - 受けた直後の攻めを飛に固定しない。既存の攻め評価で香などを選んでもよい。
  - 旧来のパスを記憶した応答キャッシュで、新しい受け比較を飛ばさない。
  - 説明ログには2枚対2枚が推定であること、初期ランク補正を外したこと、実際に使った候補評価値を記録する。
  forbidden:
  - 弱い手であることだけで一律に受ける。
  - 自分が1枚・3枚持ち、し・飛・角・王・玉、敵の2枚目以降へこの補正変更を広げる。
  alternative_under_consideration:
    risk: 初手をパスし、相手の2枚目の同種を受けてから動く筋は検討材料として保持し、この変更では別のリスク戦術として実装しない。
  regression:
    source_report: goita_ai_review_20261119034643_round1_B_turn2.json
    expected: 銀で受ける。直後の攻めは香または飛を許容する。
    tests:
    - tests/test_opening_pair_receive.py
    - tests/late_receive_log_ui.cjs
