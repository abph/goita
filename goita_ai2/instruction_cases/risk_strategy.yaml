schema_version: 1
category: risk_strategy
thinking_style: risk
runtime_connected: false
description: 高得点の可能性を優先する判断を、安全思考と混ぜずに蓄積する資料
cases:
  - id: RISK-001
    status: reference
    title: 自分の低得点上がりを残しながら相方の高得点上がりを待つ
    source_report: goita_ai_review_20261003012646_round5_A_turn19.json
    conditions:
      - 自分には確定した低得点上がりがある
      - 別の手を選んでも、自分が後から上がる退路を残せる
      - 相方の公開した攻め順から、相方が同種駒を複数持つ根拠がある
      - 相方が公開情報上の4枚目など、通りやすい上がり駒を持つ可能性がある
      - 敵の即上がりを許す危険が許容範囲内である
    safe_policy:
      action: しを伏せて玉で攻める
      guaranteed_score: 20
      reason: 自分の20点上がりを確定させる
    risk_policy:
      action: 馬を伏せてしで攻める
      fallback: 王で受けて、残したしで10点上がりを狙う
      upside: 相方が受けて公開情報上の4枚目の銀を出し、30点以上で上がる機会を待つ
    required_evidence:
      - 相方が2つ目の攻めに香を出したため、初期2香の可能性を評価する
      - 相方の残り駒と公開済み駒から、相方の上がり経路を評価する
      - 自分の退路が本当に残るか、敵方の応答を含めて探索する
    forbidden:
      - 安全思考の補正データへ混ぜる
      - 相方の実際の非公開手駒を参照する
      - 退路や敵の即上がり危険を確認せず、高得点だけを理由に選ぶ
    note: 現在の強化中AI2は安全思考を使うため、このケースでは安全策を維持する。リスク思考を有効化する将来段階で回帰候補にする。
    regression:
      state: deferred
      reason: リスク思考の実行モデルをまだ有効化していない

  - id: RISK-002
    status: reference
    title: 一巡しやすいリーチ攻めで高得点の残り2枚を作る
    source_report: goita_ai_review_20261003065738_round4_A_turn11.json
    conditions:
      - 伏せて攻めるとリーチになり、その攻めが一巡すれば次の手番で上がれる
      - 攻め駒の通常4枚が公開情報と自分の手駒ですべて判明している
      - 同じ攻め駒が直前に一巡するなど、王か玉以外では受けられない根拠がある
      - 伏せ駒によって、次に残る2枚の上がり得点が大きく変わる
      - 王か玉で受けられて攻めが止まる危険を許容する
    safe_policy:
      action: 金を伏せて銀で攻める
      outcome_if_attack_returns: 香と金を残して30点で上がる
      reason: 受けと終盤待ちに使える香を残し、金の組を崩して危険を抑える
    risk_policy:
      action: 香を伏せて銀で攻める
      outcome_if_attack_returns: 金と金を残して60点で上がる
      upside: 銀が一巡したときの上がり得点を30点から60点へ上げる
      downside: 銀を王か玉で受けられた場合、香を残した安全策より受け幅が狭い
    required_evidence:
      - 攻め駒の公開枚数と、自分が持つ残り枚数を数える
      - 同じ攻めに対する各席の直前の応答を確認する
      - 未使用の王か玉が敵方にある確率を評価する
      - 各伏せ候補について、攻めが一巡した場合の残り2枚と上がり点を比較する
      - 攻めを受けられた場合の失敗経路も情報集合探索で比較する
    forbidden:
      - 安全思考の補正データへ混ぜる
      - 他家の実際の非公開手駒を参照する
      - 攻めが一巡する根拠を確認せず、得点差だけで高得点側を選ぶ
      - 低得点側が確定上がりであるかのように扱う
    note: 現在の強化中AI2は安全思考を使うため、このケースでは金を伏せて銀で攻める判断を維持する。リスク思考を有効化する将来段階で、攻めの一巡確率と次の上がり点を比較する回帰候補にする。
    regression:
      state: deferred
      reason: リスク思考の実行モデルをまだ有効化していない
