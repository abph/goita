schema_version: 1
category: regression_candidates
notation: "prefixの各行は [席, 伏せまたは受け, 攻め]。省略された席はパス。"
cases:
  - id: KIFU-001
    status: confirmed
    linked_policy: SHI-005
    title: し0枚の味方が銀を受けてし攻め中止を伝える
    dealer: A
    hands:
      A: 金角しし飛銀馬し
      B: 銀しし銀し馬し王
      C: 銀金馬馬飛金角香
      D: 金玉し香し香香し
    prefix:
      - [A, 馬, し]
      - [B, し, 銀]
    actor: C
    actual:
      type: pass
    expected:
      required_type: receive
      block: 銀
      followup: し以外を攻める
    forbidden:
      - pass
    reason: 自分がし0枚であることを味方へ早く伝え、逆し攻めを防ぐ
    regression: covered

