schema_version: 1
category: attack
cases:
  - id: ATT-001
    status: confirmed
    title: 攻め1で単発の香・馬・銀・金を安易に出さない
    classification: singleton_avoidance
    priority: high
    conditions:
      - 攻め1枚目
      - 香・馬・銀・金の候補が1枚だけ
      - 複数持ちの攻め、または正しい情報を伝えるし攻めが候補にある
    required: 複数持ちの攻め、またはし攻めを優先し、相方に正しい手駒情報を伝える
    forbidden:
      - 明確な目的がないのに単発の香・馬・銀・金を先に出す
    exceptions:
      - 確定上がり・高得点上がりの経路がある
      - 香を一巡させた後、王と玉で上がる短い経路がある
      - 公開情報上の4枚目で、相方も単発と判断できる
      - 明確なかかりごたえ、または敵の確定上がりを防ぐ目的がある
    reason: 攻め1の香・馬・銀・金は同種を2枚以上持つ合図になる。勝算なく単発を出すと相方の戦略を誤らせる
    regression:
      state: covered
      tests:
        - tests/test_attack_strategy_module.py::test_three_shi_is_preferred_over_singletons_after_receiving_big_piece
        - tests/test_attack_strategy_module.py::test_three_shi_returns_shi_instead_of_false_singleton_first_signal
        - tests/test_attack_strategy_module.py::test_singleton_first_attack_penalty_covers_all_signals_and_keeps_royal_finish

  - id: ATT-002
    status: confirmed
    title: 中駒ペアと大駒1枚で王なしの攻め順
    classification: fixed_sequence
    priority: high
    conditions:
      - 香以外の中駒ペアが1組
      - 大駒が1枚
      - 王玉なし
    preferred:
      - 攻め1は中駒ペア
      - 攻め2は同じ中駒
      - 攻め3は大駒
    example: 金 → 金 → 飛
    reason: 王玉の受け幅がないため、先にペアを連打して大駒を決定打として残す
    regression:
      state: covered
      tests:
        - tests/test_attack_plan_templates.py

  - id: ATT-003
    status: confirmed
    title: 中駒ペアと大駒1枚で王ありの攻め順
    classification: fixed_sequence
    priority: high
    conditions:
      - 香以外の中駒ペアが1組
      - 大駒が1枚
      - 王または玉が1枚
    preferred:
      - 攻め1は中駒ペア
      - 攻め2は大駒
      - 攻め3は中駒ペア
    example: 金 → 飛 → 金
    reason: 王玉の受けを橋渡しに使い、ペアの片方を3つ目の強い攻めとして残す
    regression:
      state: covered
      tests:
        - tests/test_attack_plan_templates.py

  - id: ATT-004
    status: confirmed
    title: 伏せる前に攻め3枚の計画を作る
    classification: whole_route_planning
    priority: critical
    conditions:
      - 伏せ駒と攻め駒を同時に選ぶ局面
    required: 現在の一手だけでなく、攻め1・攻め2・攻め3と最後の待ちを先に計画する
    forbidden:
      - その時点で点数の低い駒を機械的に伏せる
      - 3つ目に予定した駒を途中で伏せる
    reason: 攻め順を先に決めないと、角などの決定打や王玉の受け幅を自分で失う
    regression:
      state: covered
      tests:
        - tests/test_attack_planning_module.py
        - tests/test_branched_attack_plan.py

  - id: ATT-005
    status: confirmed
    title: ししより、しと別駒を残す
    classification: block_selection
    priority: high
    conditions:
      - 伏せ候補がしと別の駒
      - 伏せ後の残り2枚が、ししまたはしと別駒になる
      - 確定上がり計画が別の待ちを要求していない
    required: し以外の駒を伏せ、しと別駒の待ちを優先する
    reason: しは受けに使え、別駒は上がり駒や差し込みの選択肢になる
    regression:
      state: partial
      note: ブロック評価へ反映済み。代表局面の固定テストが必要

  - id: ATT-006
    status: confirmed
    title: 同じ中駒4枚では余る1枚を伏せる
    classification: four_middle_block
    priority: high
    conditions:
      - 馬・銀・金のいずれかを4枚持つ
      - その駒を3回攻める計画
    required: 4枚のうち1枚を伏せ駒にする
    forbidden:
      - 点数の高い別駒を伏せ、4枚目の中駒を手元に余らせる
    reason: 攻めに使えるのは通常3枚であり、余る4枚目を伏せた方が最後の上がり点を残せる
    regression:
      state: covered
      tests:
        - tests/test_attack_strategy_module.py::test_remaining_silver_pair_continues_three_silver_attack

  - id: ATT-007
    status: confirmed
    title: 公開された4枚目の中駒は3つ目まで残す
    classification: fourth_piece_finish
    priority: high
    conditions:
      - 味方が同種を出し切り、自分の駒が公開情報上の4枚目
      - 自分の攻め1枚目または2枚目
    required: 4枚目を原則として攻め3まで温存する
    forbidden:
      - かかりごたえとして攻め1に使う
    reason: 4枚目である情報はすでに伝わっており、敵がパスできない3つ目に使う方が強い
    regression:
      state: covered
      tests:
        - tests/test_attack_strategy_module.py::test_fourth_kyosha_is_reserved_after_receiving_gold
        - tests/test_attack_plan_templates.py::test_fourth_middle_template_reserves_the_piece_for_attack_three

  - id: ATT-008
    status: confirmed
    title: 多い中駒の連打を少ないペアより優先する
    classification: multiplicity
    priority: high
    conditions:
      - 3枚以上ある中駒と、2枚の別中駒がある
      - 特別な確定上がり計画がない
    required: 3枚以上ある中駒を先に連打候補にする
    example: 銀3枚と馬2枚なら銀を優先する
    reason: 占有率が高く、3回の攻めを一貫して作りやすい
    regression:
      state: covered
      tests:
        - tests/test_attack_strategy_module.py::test_remaining_silver_pair_continues_three_silver_attack

  - id: ATT-009
    status: confirmed
    title: 親の3し・大駒ばらばら2枚・王1枚
    classification: dealer_fixed_sequence
    priority: high
    conditions:
      - 自分が親
      - しが3枚
      - 飛と角が各1枚
      - 王または玉が1枚
    required:
      - 伏せ1はし
      - 攻め1は飛
      - 伏せ2はしを基本とする
      - 攻め2は角
      - 攻め3は局面で決める
    forbidden:
      - 銀などの受け駒を最初に伏せる
      - 王玉を2つ目の伏せに使う
    reason: 大駒を連続して王玉を切らせ、しと王玉の受け幅を残す
    regression:
      state: covered
      tests:
        - tests/test_attack_strategy_module.py::test_dealer_three_shi_two_single_bigs_and_royal_uses_hisha_then_kaku

  - id: ATT-010
    status: confirmed
    title: 飛角のかかりごたえを目的にしない
    classification: kakarigotae_scope
    priority: high
    conditions:
      - 飛または角が味方の使用と重なっている
    required: 通常の攻め計画、確定上がり、得点を優先して評価する
    forbidden:
      - 飛角であることだけを理由にかかりごたえを優先する
    reason: 大駒は元から強く、味方への枚数合図より攻め順と上がり点の価値が大きい
    regression:
      state: partial
      note: かかりごたえ判定から大駒を除外済み。専用回帰ケースは追加予定

  - id: ATT-011
    status: confirmed
    title: 相手リーチには持っていなさそうな駒を出す
    classification: anti_reach
    priority: critical
    conditions:
      - 次の敵がリーチ
      - 自分が3つ目の攻めを選ぶ
      - 複数の合法な攻め駒がある
    required: 公開情報と推定手駒から、敵の保有確率が最も低い駒を優先する
    example: 敵が金を使っており飛の使用情報がない場合でも、全体在庫から飛の方が低確率なら飛を出す
    forbidden:
      - 駒の点数だけで攻めを決める
    reason: 点数より先に、敵に受けられて上がられる確率を下げる必要がある
    regression:
      state: covered
      tests:
        - tests/test_endgame_module.py::test_reach_avoidance_conditional_tsume_prefers_hisha_over_kin

  - id: ATT-012
    status: confirmed
    title: 攻め1の占有率メッセージを守る
    classification: first_attack_signal
    priority: normal
    conditions:
      - 自分の攻め1を選ぶ
      - 複数の構造候補がある
    required: 単発駒より、ペア・3枚・4枚の駒や定石上の先頭駒を優先する
    exceptions:
      - だまし香
      - だましし
      - 確定上がりプラン
    reason: 味方は最初の攻めから自分の占有率と継続可能性を推定する
    regression:
      state: partial
      note: 攻め評価と代表攻めテンプレートに反映済み

  - id: ATT-013
    status: confirmed
    title: 攻め駒の目的を固定攻め順より先に再評価する
    classification: attack_intent_lifecycle
    priority: critical
    conditions:
      - 攻め駒を、王玉を誘う・味方へ合図する・味方へ届けるなど明確な目的で出す
      - その攻めに対する全員の応答がパス、または目的と違う受けになる
      - 同じ目的を続けられる合法手と、固定攻め順の候補がある
    required:
      - 攻め駒ごとに目的を記録する
      - 目的が未達なら、目的の継続手と固定順を同じ評価で比較する
      - 目的が達成・阻止されたら、その目的を終了して別の計画へ移る
    forbidden:
      - 固定攻め順だけを理由に、未達の目的を無視する
      - 棋譜1件だけの駒順を専用規則として追加する
    reason: 攻めの駒は何を出すかだけでなく、何を起こすために出すかで価値が変わる。目的が未達の局面では、最初の判断理由を継続して再評価する
    regression:
      state: covered
      tests:
        - tests/test_attack_intent.py::test_attack_intent_reconsiders_fixed_sequence_after_all_passes
        - tests/test_attack_intent.py::test_attack_intent_is_archived_when_enemy_uses_royal

  - id: ATT-014
    status: confirmed
    title: 公開した攻め順の続き駒を実際に残す
    classification: attack_sequence_signal
    priority: high
    conditions:
      - 自分の攻め1と攻め2が、経験者に知られた複数枚の攻め型を示す
      - 味方がその攻め順から、攻め3に残る駒を推測できる
    required:
      - 攻め2を出した後も、攻め順が示した続き駒を手元に残す
      - 続きがない場合は、定型を示さない別の攻め駒と比較する
    example: 大駒または中駒から香を出すなら、もう1枚の香を残して香攻めを続行できるようにする
    exceptions:
      - 確定上がり
      - かかりごたえ
      - 公開された4枚目
      - 成功条件を持つ攻め目的
    forbidden:
      - 1香しかないのに大駒から香へつなぎ、相方に2香の続行を期待させる
    reason: 味方は1枚ごとの攻めだけでなく、公開された攻め順から残りの攻め駒を推測して戦略を決める
    regression:
      state: covered
      tests:
        - tests/test_attack_strategy_module.py::test_second_attack_avoids_false_big_kyosha_continuation_signal
        - tests/test_attack_strategy_module.py::test_second_attack_keeps_truthful_big_kyosha_continuation

  - id: ATT-015
    status: confirmed
    title: 確実な攻めを残せるなら攻め1で二枚持ちを伝える
    classification: truthful_first_pair_signal
    priority: high
    conditions:
      - 自分の攻め1を選ぶ
      - 香・馬・銀・金のいずれかを2枚以上持つ
      - その駒を今出しても、同じ駒をもう1枚手元に残せる
      - 公開情報上で確実に通る攻めを、その後に2枚以上残せる
      - 二枚持ちの合図を先にしても、将来攻め計画の上がり点が下がらない
      - 敵方がまだリーチ直前ではない
    required:
      - 二枚持ちの駒を攻め1に出し、相方へ継続可能性を伝える
      - 公開情報上で確実に通る駒は、合図の後の攻めとして残す
    forbidden:
      - 確実に通る駒を先に使い、攻め3まで二枚持ちの情報を隠したままにする
    reason: 確実な攻めの順番を後ろへ移しても上がり経路を保てるなら、攻め1で正しい手駒情報を渡す方が、相方が早く適切な戦略を作れる
    regression:
      state: covered
      tests:
        - tests/test_attack_strategy_module.py::test_first_pair_signal_precedes_reserved_unstoppable_attacks
        - tests/test_attack_strategy_module.py::test_truthful_first_pair_signal_applies_to_each_signalling_piece
        - tests/test_attack_strategy_module.py::test_first_pair_signal_waits_when_an_enemy_is_near_reach
        - tests/test_neural_policy.py::test_truthful_first_pair_signal_agrees_with_global_neural_choice

  - id: ATT-016
    status: confirmed
    title: 相方のし主張後は余分なしを伏せて3つ目の大駒を残す
    classification: spare_shi_block_for_third_attack
    priority: high
    conditions:
      - 相方が最初の攻めにしを出し、複数しを主張している
      - 敵方がし攻めを始めていない
      - 自分がしを2枚持ち、1枚を伏せても1枚残せる
      - 王か玉を残せる
      - 同じ駒による2つ目の攻めを行う局面
      - 単発の飛か角を3つ目の攻めとして残せる
    required: しを1枚伏せ、現在の攻めを続けながら3つ目の大駒を残す
    forbidden:
      - 相方がしを出したという理由だけで、自分のしを2枚とも温存する
      - 敵方がし攻めを始めているのに守備のしを減らす
      - 最後のし、または唯一の受け幅を失う
    reason: 相方が十分なしを主張し、敵方のし圧力がなければ、自分の2枚目のしより3つ目に使える大駒の方が攻めの継続価値が高い
    regression:
      state: covered
      tests:
        - tests/test_safe_thinking_strategy.py::test_safe_thinking_spends_spare_shi_and_keeps_rook_for_third_attack
        - tests/test_safe_thinking_strategy.py::test_spare_shi_rule_stays_isolated_from_saved_current_ai
        - tests/test_safe_thinking_strategy.py::test_spare_shi_rule_requires_no_enemy_shi_attack_pressure
