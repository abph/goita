schema_version: 1
category: middle_signal_inference_and_ally_reach_rescue
cases:
- id: MIDDLE-SIGNAL-RESCUE-001
  status: confirmed
  profile: experimental_ai2
  title: 中駒の初手主張と呼応を分け、公開された枚数で配分を更新する
  conditions:
  - 香・馬・銀・金の初手を、相方が先に公開した同種への呼応として出す
  required:
  - 独立した初手の主張と相方への呼応を記録して区別する。呼応だけで新たな2枚持ちの下限を作らない。
  - 公開された使用枚数、自分の初期枚数、全体4枚の在庫を優先して、最初の主張と呼応を同時に整合させる。
  - 確定した使用枚数と矛盾する場合は未確認の弱い推定から見直し、観測済みの下限を削らない。
  - 呼応のある中駒の配分は代表候補として扱い、だましや伏せによる別配分も重みを下げて探索に残す。代表候補の範囲を物理的な確定条件に使わない。
  - 既存の終盤モデルで同じ呼応の証拠を評価済みなら、重みを二重に適用しない。
  - 初期配分、現在手駒、伏せ駒の推定を分ける。最初に2枚持ちと推定した駒を1枚公開しても、残る1枚を伏せた可能性は残す。
  example: Dが香0枚。Aが初手に香、Cが香で呼応し、Bが香で受けたら、初期配分の代表候補をA2・B1・C1・D0とする。Aの残る香の可能性を探索から除外しない。
  regression:
    source_report: goita_ai_review_20261119070845_round3_D_turn16.json
    tests:
    - tests/test_middle_signal_rescue.py
- id: MIDDLE-SIGNAL-RESCUE-002
  status: confirmed
  profile: experimental_ai2
  title: リーチした味方の攻めを敵に渡す危険と、受けて届け直す筋を比較する
  conditions:
  - 相方が残り2枚で攻めており、自分が受けるかパスするか選べる
  - 自分の次に応答する敵が残り2〜4枚で、相方より先に受けられる
  required:
  - 同じ公開情報に基づく重み付き想定配牌で、パスと各受け・直後の各攻めを一組で比較する。
  - この救援比較の標本は判定時の公開情報から独立に作り直す。過去の先読みから引き継いだ候補配牌の偏りで結論が変わらないようにし、通常探索の先読み再利用は維持する。
  - 敵が受けた後の攻めと残り手駒、相方への届き方、自分の受け返しを含む。実際の他家の非公開手駒は使わない。
  - 次のパスが敵の即上がりを許す最後の受け手を予測するときは、その人自身の合法な受けと公開枚数から受けを試みるモデルとする。
  - 席の文字だけで候補配牌が変わらないよう、この比較は観測者を基準とする相対席順で標本を作る。
  - 味方への救援では、敵の受けと攻めの一周を含めるため48候補・深さ8を完了してから深さ10へ進む。追加最大2秒・全体20秒の上限を守り、未完了の候補値を混ぜず、完了した深さの結果を使う。
  - 既存の確定上がりや優先戦術を維持し、標本比較を確定上がりとは呼ばない。バックグラウンドでは追加比較を行わない。
  - 採用した受けと攻めを保存し、局面が変わったら破棄する。採用しなかった通常探索手を戦術辞書に学習させない。
  - 説明ログに主張と呼応、初期配分の代表候補、実際の比較値、敵の次の攻めの標本上の危険、深さと時間制限を記録する。
  - 直前からの局面再現だけでなく、対象AIに以前の手番も実際に思考させた経路で回帰確認する。
  regression:
    source_report: goita_ai_review_20261119070845_round3_D_turn16.json
    expected: 玉で銀を受け、飛で攻める
    tests:
    - tests/test_middle_signal_rescue.py
    - tests/late_receive_log_ui.cjs
