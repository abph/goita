schema_version: 1
category: attack_strategy
cases:
  - id: PLAN-BLOCK-001
    status: confirmed
    scope: 強化中AI2
    title: 連続攻めに余る同種駒を伏せる案を事前計画の生成時から比較する
    source_report: goita_ai_review_20261025044916_round2_C_turn7.json
    conditions:
      - 伏せて攻める計画の攻め駒が香・馬・銀・金・角・飛のいずれか
      - 自分の手駒と公開済み枚数から、その種類の駒が他者に残っていない
      - 同じ駒を伏せて攻めても、残る計画内の攻め回数分の駒が残る
      - 別の駒を伏せる案と比べ、一巡を仮定した上がり点が下がらず受けの種類が増える
    required:
      - 将来の伏せ候補を絞る前に比較し、余分な同種駒を伏せる案を優先して計画に残す
      - 将来の指定攻め駒と保護対象の駒は既存の予約条件を満たす
      - 古い計画で伏せ駒を変更する必要があれば計画全体を無効にして再計画する
      - 再評価が時間切れになっても、無効にした古い伏せの計画へ戻さない
      - 受けの種類には王か玉で受けられる種類を正しく含める
      - 説明に残る同種駒の枚数・必要な攻め回数・受けの種類を記録する
      - 一巡を仮定した見通しと確定上がりの証明を区別する
    exceptions:
      - 同種駒が他者に残り得る場合はこの優先変更を行わない
      - 攻め駒が不足する場合や上がり点が下がる場合は変更しない
      - 相方が初手に未反応でも同種駒3枚以上かつ他者の同種駒が0枚なら余剰分の伏せを許す
      - 未反応の相方に備えて必要な最後の同種駒を残す処理は維持する
      - 公開情報で証明済みの上がり計画や即上がりは優先する
    forbidden:
      - 報告の席・馬・金だけに固定する
      - 他者の実際の手駒や伏せ駒を参照する
      - 候補の評価点に説明のない加点をして比較結果を装う
      - 伏せ駒だけ変更して残りの計画を古いまま実行する
      - 保存版の中級者へ変更を適用する
    regression:
      tests:
        - tests/test_planned_block_reserve.py
        - tests/planned_block_reserve_log.cjs
