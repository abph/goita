cases:
- id: LANCE-RESERVE-001
  status: confirmed
  profile: experimental_ai2
  title: 最後の香の受けを失って敵の残る香を通す危険を評価する
  conditions:
  - 自分は残り4〜6枚で香1枚、現在の敵はまだ1枚目の攻めで残り6枚以上
  - 公開された使用枚数と自分の手駒を除き、所在未公開の香は1枚
  - 別の敵が独立した香の初手を示して残り4枚となり、もう1枚の香が残ると推定できる
  - 相方と現在の攻め手には香が残らないという代表配分で、自分以外に残り2枚のプレイヤーはいない
  required:
  - 香を受けた後の各攻めと継続を確認し、強い継続がなければ自分側の最後の香の受けを残す。
  - 王か玉では香の受けを代用できないこと、現在の攻め手には次の攻めから対応する余地があることを評価する。
  - 代表配分と敵の残る香は推定として扱い、実際の非公開手駒を参照せず、敵の確定上がりとは呼ばない。
  - 自分の確定上がり、即上がりの防止、相方のリーチ、強い継続がある受けは既存判断を維持する。
  - 後段の香比較探索や応答キャッシュで受けが選ばれても、この安全判断を確認する。一律の大きな加減点は追加しない。
  - 採用しなかった受けを戦術辞書に学習させず、受け後の予約攻めを破棄する。
  - 説明には最後の香、別の敵の残り枚数、現在の攻めの進行度、比較した各攻めを記録する。
  regression:
