version: 1
name: 8枚持ちの受けから一巡確定の攻めを経由して上がる
profile: experimental_ai2
status: confirmed
thinking_style: safe
conditions:
  - 自分の手駒が8枚で、合法な受けがある。
  - 受けた後の最初の攻めを、公開情報と自分の手駒だけで誰にも受けられないと証明できる。
  - その攻めで残り6枚になり、既存の公開情報による確定探索が上がりと最低得点を証明する。
required:
  - 未証明の相方への期待や通常のパス評価より、既存の確定上がり判断へ接続して比較する。
  - 探索上限を全局面で8枚に引き上げない。受けられる最初の攻めは拡張対象にしない。
  - 王や金に限定せず、一巡確定の条件とその後の証明を満たす攻めを対象とする。
  - 確定・期待・最大得点が同じ場合は、一巡確定の王か玉を最初に使う筋を引き継ぐ。
  - 予約した最初の攻めは、手駒・公開枚数・王玉の使用・各席の残り枚数が同じ場合だけ再検証して使う。
  - 他人の非公開手駒や未来の棋譜を証明に使わない。
report_example:
  source: goita_ai_review_20261122024432_round1_C_turn19.json
  preferred: 馬で受け、王で攻める。しを伏せて金、しを伏せて金、銀を伏せて角40点。
  reason: 玉は公開済みで、金は場の2枚と自分の2枚ですべて説明できる。C自身の確定筋を見落とさない。
