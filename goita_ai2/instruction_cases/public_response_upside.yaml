schema_version: 1
category: endgame
cases:
  - id: RESPONSE-UPSIDE-001
    status: confirmed
    scope: 強化中AI2
    source_report: goita_ai_review_20261105043757_round1_A_turn9.json
    title: 敵方の受け方から残り駒の所在を推測し確定点と高得点を比較する
    required:
      - 馬・銀・金・飛・角を同種で受けず王か玉で受けた履歴を、同種を持っていない可能性の材料にする
      - 敵方のリーチを許す場面のパスは、通常のパスより保有可能性を下げる材料にする
      - 味方へのパスや終盤の王か玉による受けを、同じ強さの否定材料にはしない
      - 伏せている可能性と後から公開された使用枚数を考慮し、推測で配分を不可能扱いしない
      - 高得点候補を同じ配分集合で浅く一通り比較してから深く探索する
      - 候補ごとに時間・ノード数を配分し、一候補の時間切れで他候補を未評価にしない
      - 完了した比較だけを利用し、未解決配分と失点のリスクを既存の基準で評価する
      - 確定点で150点に到達する場合はその上がりを優先する
      - 採用した比較の深さ・標本数・推定リスク・応答履歴を記録し、確定上がりとは説明しない
    forbidden:
      - 特定の席・初期手駒・棋譜IDだけで銀を出す規則にする
      - 他人の実際の手駒や伏せ駒を判断材料にする
      - 推定率を実測済みの勝率や確定した駒の所在として扱う
      - 保存版の中級者（中3）を変更する
    regression:
      tests:
        - tests/test_public_response_upside.py
        - tests/public_response_upside_log.cjs
