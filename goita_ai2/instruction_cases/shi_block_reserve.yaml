schema_version: 1
category: shi_strategy
cases:
  - id: SHI-BLOCK-001
    status: confirmed
    scope: 強化中AI2
    title: しの攻め用枚数を確保できる伏せでは他の受け駒を残す価値を比較する
    source_report: goita_ai_review_20261025040447_round1_C_turn11.json
    conditions:
      - し攻めを評価できる手駒で、伏せてしを攻める手番
      - しを伏せてしで攻めることが合法
      - その後の手駒が4枚以上あり、残る攻め回数分のしが手駒に残る
    required:
      - しが攻め回数より1枚多く残らないという理由だけで大きく減点しない
      - 必要なしを残せる代案があるとき、他の受け駒を伏せる一律加点を止める
      - 受けの種類と別の攻め筋を既存の候補評価と合わせて比較する
      - しによる受けには追加のしが必要であることを説明する
      - この評価が実際に候補順位を変えた場合だけ専用の説明を表示する
    exceptions:
      - 攻め用のしが不足する場合は既存の温存評価を維持する
      - 親の初手と、残り2枚の終盤は既存の評価を維持する
      - 公開情報による確定上がりなど上位戦術は優先する
    forbidden:
      - 報告の席や金と角だけに固定した規則
      - 他人の実際の手駒や伏せ駒を利用する
      - 保存版の中級者へ変更を適用する
    regression:
      tests:
        - tests/test_shi_block_reserve.py
